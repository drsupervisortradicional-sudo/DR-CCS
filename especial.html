<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR-CCS | Solicitud de Presupuesto</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .category-badge { background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; display: inline-block; }
        @media print { #root { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyABBIDqDnx-yu75601EQZ-yQ_VNkbdApGY",
            authDomain: "dr-ccs.firebaseapp.com",
            projectId: "dr-ccs",
            storageBucket: "dr-ccs.firebasestorage.app",
            messagingSenderId: "715483746859",
            appId: "1:715483746859:web:b3355feaa35baf709dd06e"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [products, setProducts] = useState([]);
            const [searchTerm, setSearchTerm] = useState("");
            const [nombre, setNombre] = useState("");
            const [direccion, setDireccion] = useState("");
            const [notas, setNotas] = useState("");
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [isSending, setIsSending] = useState(false);
            
            const [cart, setCart] = useState(() => {
                const saved = localStorage.getItem('dr_cart_especial');
                try { return saved ? JSON.parse(saved) : {}; } catch(e) { return {}; }
            });

            useEffect(() => {
                localStorage.setItem('dr_cart_especial', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => {
                const unsubscribeProds = db.collection("productos").onSnapshot((snapshot) => {
                    const prods = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setProducts(prods);
                });
                return () => unsubscribeProds();
            }, []);

            const sortedProducts = useMemo(() => {
                return [...products].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            }, [products]);

            const categorizedProducts = useMemo(() => {
                const filtered = sortedProducts.filter(p => (p.name || "").toLowerCase().includes(searchTerm.toLowerCase()));
                
                const groups = filtered.reduce((acc, p) => {
                    const cat = (p.category || "VARIOS").toUpperCase().trim();
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(p);
                    return acc;
                }, {});

                return Object.keys(groups).sort().reduce((acc, cat) => {
                    acc[cat] = groups[cat];
                    return acc;
                }, {});
            }, [sortedProducts, searchTerm]);

            const selectedItems = useMemo(() => {
                return sortedProducts.filter(p => cart[p.id] && cart[p.id] > 0);
            }, [sortedProducts, cart]);

            const clearCart = () => {
                if(confirm("¿Deseas vaciar tu lista de cotización?")) {
                    setCart({});
                    setNombre("");
                    setDireccion("");
                    setNotas("");
                }
            };

            const enviarSolicitudCotizacion = async () => {
                if (!nombre.trim()) return alert("Por favor, ingresá tu Nombre o Razón Social.");
                if (selectedItems.length === 0) return alert("No seleccionaste ningún artículo.");
                
                setIsSending(true);

                const itemsSolicitud = selectedItems.map(p => ({
                    id: p.id,
                    name: p.name,
                    cantidad: cart[p.id],
                    pack: p.pack || 1
                }));

                try {
                    // 1. Guarda en Firebase para llevar el registro en la base de datos
                    await db.collection("solicitudes").add({
                        cliente: nombre,
                        direccion: direccion,
                        notas: notas,
                        items: itemsSolicitud,
                        fecha: new Date().toISOString(),
                        estado: "pendiente"
                    });
                    
                    // 2. MODIFICADO: Generar texto automático detallado para WhatsApp
                    let mensajeWA = `🏛️ *Nueva Solicitud de Cotización (DR-CCS)*\n\n`;
                    mensajeWA += `👤 *Cliente:* ${nombre}\n`;
                    if (direccion.trim()) mensajeWA += `📍 *Dirección:* ${direccion}\n`;
                    if (notas.trim()) mensajeWA += `📝 *Notas:* ${notas}\n`;
                    mensajeWA += `\n📦 *Detalle del Pedido:*\n`;
                    
                    itemsSolicitud.forEach((item, index) => {
                        const totalUnidades = item.cantidad * item.pack;
                        mensajeWA += `${index + 1}. ${item.name} -> *${item.cantidad} bultos* (${totalUnidades.toLocaleString()} un.)\n`;
                    });

                    // 3. Configura tu número (Reemplazá TU_NUMERO_DE_TELEFONO por tu celular, ej: 5493412345678 sin el +)
                    const nroTelefono = "5493416384086"; 
                    const urlWhatsApp = `https://api.whatsapp.com/send?phone=${nroTelefono}&text=${encodeURIComponent(mensajeWA)}`;
                    
                    alert("¡Solicitud registrada con éxito! A continuación se abrirá WhatsApp para enviarnos el aviso.");
                    
                    // Limpieza de estados
                    setCart({});
                    setNombre("");
                    setDireccion("");
                    setNotas("");
                    setActiveTab('catalogo');

                    // Abre la ventana de WhatsApp de forma nativa
                    window.open(urlWhatsApp, '_blank');

                } catch (error) {
                    console.error("Error al enviar solicitud: ", error);
                    alert("Hubo un problema al enviar la solicitud. Por favor, reintentá.");
                } finally {
                    setIsSending(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto md:my-8 bg-white shadow-2xl md:rounded-[2.5rem] flex flex-col min-h-screen md:min-h-0 border-8 border-white relative">
                    {!isOnline && (
                        <div className="bg-red-600 text-white text-center py-2 text-xs font-bold uppercase tracking-wider animate-pulse no-print">
                            ⚠️ Sin conexión a internet - La solicitud podría no enviarse
                        </div>
                    )}
                    
                    <nav className="bg-slate-900 text-white flex p-1.5 sticky top-0 z-50 shadow-xl md:rounded-t-[1.7rem] no-print">
                        <button onClick={() => setActiveTab('catalogo')} className={`flex-1 py-4 rounded-2xl flex flex-col items-center gap-1 transition ${activeTab === 'catalogo' ? 'bg-blue-600 font-extrabold' : 'opacity-70'}`}>
                            <span className="text-lg">📋</span><span className="text-[10px] uppercase font-bold tracking-wider">Catálogo Especial</span>
                        </button>
                        <button onClick={() => setActiveTab('presupuesto')} className={`flex-1 py-4 rounded-2xl flex flex-col items-center gap-1 relative transition ${activeTab === 'presupuesto' ? 'bg-blue-600 font-extrabold' : 'opacity-70'}`}>
                            <span className="text-lg">📥</span><span className="text-[10px] uppercase font-bold tracking-wider">Enviar Solicitud</span>
                            {selectedItems.length > 0 && <span className="absolute top-2 right-4 bg-red-600 w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-bold animate-bounce">{selectedItems.length}</span>}
                        </button>
                    </nav>

                    <div className="p-6 md:p-10 flex-1">
                        {activeTab === 'catalogo' && (
                            <section>
                                <div className="mb-8">
                                    <h1 className="text-4xl font-extrabold text-slate-900">DR - Especial</h1>
                                    <p className="text-blue-600 text-xs font-bold uppercase tracking-widest">Catálogo Mayorista</p>
                                </div>
                                <input type="text" placeholder="Buscar productos..." className="w-full p-4 bg-slate-50 rounded-2xl mb-6 outline-none border focus:border-blue-500 shadow-inner" onChange={e => setSearchTerm(e.target.value)} />
                                
                                <div className="space-y-8">
                                    {Object.keys(categorizedProducts).length === 0 ? (
                                        <p className="text-center text-slate-400 font-bold uppercase py-10">No se encontraron productos</p>
                                    ) : (
                                        Object.keys(categorizedProducts).map(categoryName => (
                                            <div key={categoryName} className="space-y-4">
                                                <h2 className="text-xs font-black text-white bg-blue-600 px-5 py-3 rounded-2xl uppercase tracking-widest shadow-md flex items-center gap-2">
                                                    <span className="w-2 h-2 bg-white rounded-full inline-block"></span>
                                                    {categoryName}
                                                </h2>
                                                
                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                                    {categorizedProducts[categoryName].map(p => (
                                                        <div key={p.id} className="border-2 border-slate-100 rounded-3xl p-4 flex flex-col bg-white shadow-sm hover:border-blue-200 transition justify-between">
                                                            <div>
                                                                <div className="w-full h-28 bg-slate-50 rounded-2xl mb-3 flex items-center justify-center overflow-hidden border">
                                                                    {p.imageUrl ? (
                                                                        <img src={p.imageUrl} alt={p.name} className="w-full h-full object-contain p-1" />
                                                                    ) : (
                                                                        <span className="text-slate-300 text-2xl">🖼️</span>
                                                                    )}
                                                                </div>
                                                                <h3 className="font-bold text-slate-800 text-sm leading-snug mb-1">{p.name}</h3>
                                                                <p className="text-[13px] text-blue-600 font-bold uppercase mb-3">Precio por Volumen a Cotizar | Pack x{p.pack || 1}</p>
                                                            </div>
                                                            <div className="space-y-2">
                                                                <input type="number" min="0" placeholder="0 bultos" className="w-full p-2 border-2 border-blue-400 bg-slate-50 rounded-xl text-center font-black text-blue-600 outline-none focus:border-blue-600 shadow-sm text-sm" value={cart[p.id] || ""} onChange={e => setCart({...cart, [p.id]: parseInt(e.target.value) || 0})} />
                                                                <div className="text-center font-extrabold text-slate-500 text-xs truncate">
                                                                    {cart[p.id] > 0 ? `🛒 Unidades Totales: ${(cart[p.id] * (p.pack || 1)).toLocaleString()}` : "Cantidad en cero"}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {activeTab === 'presupuesto' && (
                            <section className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-900">Artículos a Cotizar</h2>
                                    {selectedItems.length > 0 && <button onClick={clearCart} className="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold uppercase flex items-center gap-1">❌ Vaciar</button>}
                                </div>
                                {selectedItems.length === 0 ? <p className="text-center py-20 text-slate-300 font-bold uppercase">No seleccionaste ningún artículo</p> : (
                                    <>
                                        <div className="bg-white border-2 rounded-3xl overflow-hidden shadow-sm">
                                            {selectedItems.map(p => (
                                                <div key={p.id} className="flex justify-between p-4 border-b last:border-0">
                                                    <div>
                                                        <p className="font-bold text-slate-800 text-sm">{p.name}</p>
                                                        <p className="text-[10px] text-slate-500 font-bold uppercase">{cart[p.id]} bultos (x{p.pack || 1} unidades por bulto)</p>
                                                    </div>
                                                    <p className="font-black text-blue-600 text-sm">{(cart[p.id] * (p.pack || 1)).toLocaleString()} un.</p>
                                                </div>
                                            ))}
                                            <div className="p-4 bg-blue-50 text-blue-900 font-bold text-center text-xs uppercase tracking-wider">
                                                📉 Al enviar, cerraremos valores preferenciales por volumen de bultos solicitado.
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 gap-4">
                                            <input type="text" placeholder="Tu Nombre / Razón Social" className="p-4 bg-slate-50 rounded-2xl border outline-none font-bold focus:border-blue-500" value={nombre} onChange={e => setNombre(e.target.value)} required />
                                            <input type="text" placeholder="Dirección de Entrega" className="p-4 bg-slate-50 rounded-2xl border outline-none focus:border-blue-500" value={direccion} onChange={e => setDireccion(e.target.value)} />
                                            <textarea placeholder="Notas adicionales o requerimientos del transporte..." className="w-full p-4 bg-slate-50 rounded-2xl border h-24 outline-none focus:border-blue-500" value={notas} onChange={e => setNotas(e.target.value)} />
                                            
                                            <button 
                                                onClick={enviarSolicitudCotizacion} 
                                                disabled={isSending} 
                                                className={`w-full text-white font-bold p-4 rounded-2xl uppercase tracking-wider text-xs shadow-md transition ${isSending ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                                            >
                                                {isSending ? "🚀 Enviando Solicitud..." : "📨 Enviar Lista Para Cotización"}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </section>
                        )}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
