<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentasIQ Master | Panel de Control CRM</title>
    <!-- Firebase Legacy Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel estables UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        @media print { #root { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyABBIDqDnx-yu75601EQZ-yQ_VNkbdApGY",
            authDomain: "dr-ccs.firebaseapp.com",
            projectId: "dr-ccs",
            storageBucket: "dr-ccs.firebasestorage.app",
            messagingSenderId: "715483746859",
            appId: "1:715483746859:web:b3355feaa35baf709dd06e"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const App = () => {
            const [activeTab, setActiveTab] = useState('crm');
            const [clientes, setClientes] = useState([]);
            const [listas, setListas] = useState([]);
            const [solicitudes, setSolicitudes] = useState([]);
            const [movimientos, setMovimientos] = useState([]);
            
            // Controles y Buscadores
            const [editingCliente, setEditingCliente] = useState(null);
            const [activeListaId, setActiveListaId] = useState("");
            const [bulkData, setBulkData] = useState("");
            const [bulkClientesData, setBulkClientesData] = useState("");
            
            // Buscadores
            const [crmSearch, setCrmSearch] = useState("");
            const [crmListaFilter, setCrmListaFilter] = useState("");
            const [clienteSearch, setClienteSearch] = useState("");
            const [listaSearch, setListaSearch] = useState("");

            // Cotizaciones Especiales
            const [selectedSolicitud, setSelectedSolicitud] = useState(null);
            const [descuentosCotizacion, setDescuentosCotizacion] = useState({});

            // Cuentas Corrientes, Saldos e Inactivos
            const [selectedClienteCuenta, setSelectedClienteCuenta] = useState("");
            const [searchClienteCuentaQuery, setSearchClienteCuentaQuery] = useState("");
            const [saldoFiltroTipo, setSaldoFiltroTipo] = useState("TODOS"); // TODOS | DEUDORES | FAVOR
            const [mesComision, setMesComision] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
            const [pctComision, setPctComision] = useState(5);

            // Carga en tiempo real de Firebase
            useEffect(() => {
                const unsubClientes = db.collection("v3_clientes").onSnapshot(s => 
                    setClientes(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubListas = db.collection("v3_listas").onSnapshot(s => 
                    setListas(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubSols = db.collection("solicitudes").orderBy("fecha", "desc").onSnapshot(s => 
                    setSolicitudes(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubMovs = db.collection("v3_movimientos").onSnapshot(s => 
                    setMovimientos(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                return () => { unsubClientes(); unsubListas(); unsubSols(); unsubMovs(); };
            }, []);

            const parseMoney = (val) => {
                if (val === undefined || val === null) return 0;
                let clean = val.toString().replace("$", "").replace(/\./g, "").replace(",", ".");
                return parseFloat(clean) || 0;
            };

            // CRM & AGENDA
            const agendaHoyFiltrada = useMemo(() => {
                const hoy = new Date();
                const query = crmSearch.toLowerCase().trim();

                const alertasBase = clientes.map(c => {
                    const ultEnvio = c.ultimo_envio ? new Date(c.ultimo_envio) : null;
                    const ultVisita = c.ultimo_visita ? new Date(c.ultimo_visita) : null;
                    const diasDesdeEnvio = ultEnvio ? Math.floor((hoy - ultEnvio) / (1000 * 60 * 60 * 24)) : 999;
                    const diasDesdeVisita = ultVisita ? Math.floor((hoy - ultVisita) / (1000 * 60 * 60 * 24)) : 999;

                    return {
                        ...c,
                        tocaEnvio: diasDesdeEnvio >= (parseInt(c.frecuencia_envio) || 7),
                        tocaVisita: diasDesdeVisita >= (parseInt(c.frecuencia_visita) || 15),
                        diasDesdeEnvio,
                        diasDesdeVisita
                    };
                }).filter(c => c.tocaEnvio || c.tocaVisita);

                return alertasBase.filter(c => {
                    const nombreMatch = (c.nombre || "").toLowerCase().includes(query);
                    const direccMatch = (c.direccion || "").toLowerCase().includes(query);
                    const listaMatch = crmListaFilter === "" || c.lista_id === crmListaFilter;
                    return (nombreMatch || direccMatch) && listaMatch;
                });
            }, [clientes, crmSearch, crmListaFilter]);

            // Cartera de clientes filtrada
            const clientesFiltrados = useMemo(() => {
                const query = clienteSearch.toLowerCase().trim();
                return clientes.filter(c => {
                    const nombreMatch = (c.nombre || "").toLowerCase().includes(query);
                    const direccMatch = (c.direccion || "").toLowerCase().includes(query);
                    const nombreLista = listas.find(l => l.id === c.lista_id)?.nombre_lista || "Base General";
                    const listaMatch = nombreLista.toLowerCase().includes(query);
                    return nombreMatch || direccMatch || listaMatch;
                });
            }, [clientes, clienteSearch, listas]);

            // BUSCADOR INTELIGENTE Y CÁLCULO DE SALDOS EXACTOS (Redondeado a 2 decimales)
            const clientesConSaldoCalculado = useMemo(() => {
                return clientes.map(c => {
                    const movsCliente = movimientos.filter(m => m.cliente_id === c.id);
                    const saldoBruto = movsCliente.reduce((acc, m) => {
                        return m.tipo === 'FACTURA' ? acc + (m.monto || 0) : acc - (m.monto || 0);
                    }, 0);
                    
                    // CORRECCIÓN CLAVE: Redondeo seguro de precisión flotante a 2 decimales
                    const saldo = Math.round(saldoBruto * 100) / 100;
                    return { ...c, saldo };
                });
            }, [clientes, movimientos]);

            // LISTADO DE SALDOS CON FILTROS INTELIGENTES Y ESTRICTOS
            const clientesSaldosFiltrados = useMemo(() => {
                const q = searchClienteCuentaQuery.toLowerCase().trim();
                return clientesConSaldoCalculado.filter(c => {
                    const matchTexto = (c.nombre || "").toLowerCase().includes(q) || (c.direccion || "").toLowerCase().includes(q);
                    if (!matchTexto) return false;

                    // FILTROS FINANCIEROS EXCLUSIVOS (Excluyen el $0.00 absoluto)
                    if (saldoFiltroTipo === 'DEUDORES') return c.saldo > 0.001;
                    if (saldoFiltroTipo === 'FAVOR') return c.saldo < -0.001;
                    return true; // TODOS
                });
            }, [clientesConSaldoCalculado, searchClienteCuentaQuery, saldoFiltroTipo]);

            // CLIENTES INACTIVOS EN EL MES EN CURSO
            const clientesInactivosMes = useMemo(() => {
                const mesActual = new Date().toISOString().slice(0, 7); // YYYY-MM
                return clientes.filter(c => {
                    const movsMes = movimientos.filter(m => m.cliente_id === c.id && m.fecha && m.fecha.startsWith(mesActual));
                    return movsMes.length === 0;
                });
            }, [clientes, movimientos]);

            // CRUD Cliente Individual
            const handleSaveCliente = async (e) => {
                e.preventDefault();
                const f = e.target;
                const id = editingCliente ? editingCliente.id : "cli_" + Date.now();
                await db.collection("v3_clientes").doc(id).set({
                    nombre: f.c_nombre.value,
                    telefono: f.c_telefono.value,
                    direccion: f.c_direccion.value,
                    lista_id: f.c_lista.value,
                    descuento_extra: parseFloat(f.c_desc.value) || 0,
                    frecuencia_envio: parseInt(f.c_frec_envio.value) || 7,
                    frecuencia_visita: parseInt(f.c_frec_visita.value) || 14,
                    ultimo_envio: editingCliente?.ultimo_envio || "",
                    ultimo_visita: editingCliente?.ultimo_visita || ""
                }, { merge: true });
                setEditingCliente(null);
                f.reset();
            };

            // Importación Masiva Clientes
            const handleBulkClientesImport = async () => {
                const rows = bulkClientesData.trim().split("\n");
                const batch = db.batch();
                rows.forEach(row => {
                    const cols = row.split("\t");
                    if (cols.length >= 2) {
                        const id = "cli_" + (Date.now() + Math.random()).toString().replace(".","");
                        const nombreListaExcel = cols[3] ? cols[3].trim().toUpperCase() : "";
                        const listaEncontrada = listas.find(l => l.nombre_lista.toUpperCase() === nombreListaExcel);
                        const descExtra = cols[4] ? parseFloat(cols[4].replace("%", "").trim()) || 0 : 0;
                        
                        batch.set(db.collection("v3_clientes").doc(id), {
                            nombre: cols[0].trim(),
                            telefono: cols[1].trim().replace("+", ""),
                            direccion: cols[2] ? cols[2].trim() : "",
                            lista_id: listaEncontrada ? listaEncontrada.id : "", 
                            descuento_extra: descExtra,
                            frecuencia_envio: 7, 
                            frecuencia_visita: 14, 
                            ultimo_envio: "",
                            ultimo_visita: ""
                        });
                    }
                });
                await batch.commit();
                setBulkClientesData("");
                alert("Cartera importada exitosamente.");
            };

            // Crear Nueva Lista
            const handleCreateLista = async () => {
                const nombre = prompt("Nombre de la nueva Lista de Precios:");
                if(!nombre) return;
                const id = "lista_" + Date.now();
                await db.collection("v3_listas").doc(id).set({
                    nombre_lista: nombre.toUpperCase().trim(),
                    productos: []
                });
            };

            // Inyectar Excel a Lista
            const handleBulkProductosListaImport = async () => {
                if(!activeListaId) return alert("Seleccioná una lista de la izquierda.");
                const rows = bulkData.trim().split("\n");
                const listaActual = listas.find(l => l.id === activeListaId);
                let productosActuales = listaActual?.productos ? [...listaActual.productos] : [];

                rows.forEach(row => {
                    const cols = row.split("\t");
                    if (cols.length >= 2) {
                        const prodId = "prod_" + (Date.now() + Math.random()).toString().replace(".","");
                        productosActuales.push({
                            id: prodId,
                            name: cols[0].trim(),
                            price: parseMoney(cols[1]),
                            pack: parseInt(cols[2]) || 1,
                            category: (cols[3] || "VARIOS").trim().toUpperCase(),
                            imageUrl: cols[4] ? cols[4].trim() : "",
                            es_oferta: cols[5] ? cols[5].trim().toUpperCase() === "SI" : false
                        });
                    }
                });

                await db.collection("v3_listas").doc(activeListaId).update({ productos: productosActuales });
                setBulkData("");
                alert("Productos inyectados correctamente.");
            };

            // Edición Completa en Caliente
            const handleEditProductoInLista = async (p) => {
                const nuevoNombre = prompt("Descripción / Marca del artículo:", p.name);
                if (nuevoNombre === null) return;

                const nuevoPrecioInput = prompt("Precio específico ($):", p.price);
                if (nuevoPrecioInput === null) return;

                const nuevoPack = parseInt(prompt("Unidades por bulto (Pack):", p.pack)) || 1;
                const nuevaCatInput = prompt("Rubro / Categoría:", p.category || "VARIOS");
                const nuevaImagen = prompt("URL de la imagen (Opcional):", p.imageUrl || "");
                const esOfertaInput = prompt("¿Está en Oferta? (SI / NO):", p.es_oferta ? "SI" : "NO");

                const listaActual = listas.find(l => l.id === activeListaId);
                const productosActualizados = listaActual.productos.map(item => {
                    if (item.id === p.id) {
                        return { 
                            ...item, 
                            name: nuevoNombre.trim(),
                            price: parseMoney(nuevoPrecioInput), 
                            pack: nuevoPack, 
                            category: (nuevaCatInput || "VARIOS").trim().toUpperCase(),
                            imageUrl: nuevaImagen.trim(),
                            es_oferta: esOfertaInput ? esOfertaInput.trim().toUpperCase() === "SI" : false 
                        };
                    }
                    return item;
                });

                await db.collection("v3_listas").doc(activeListaId).update({ productos: productosActualizados });
                alert("Producto modificado.");
            };

            // Botón Producto Especial
            const addTemporalProductToList = async () => {
                if(!activeListaId) return alert("Por favor, seleccioná primero una lista del panel izquierdo.");
                
                const name = prompt("Descripción del producto especial solicitante:");
                if (!name || !name.trim()) return;

                const priceInput = prompt("Precio unitario acordado ($):");
                if (priceInput === null) return;

                const pack = parseInt(prompt("Unidades por bulto (Pack):", "1")) || 1;
                const catInput = prompt("Rubro / Categoría:", "ESPECIALES");

                const listaActual = listas.find(l => l.id === activeListaId);
                let productosActuales = listaActual?.productos ? [...listaActual.productos] : [];
                
                productosActuales.push({
                    id: "temp_" + Date.now(),
                    name: "(ESPECIAL) " + name.trim(),
                    price: parseMoney(priceInput),
                    pack: pack,
                    category: (catInput || "ESPECIALES").trim().toUpperCase(),
                    es_oferta: false,
                    isTemp: true
                });

                await db.collection("v3_listas").doc(activeListaId).update({ productos: productosActuales });
                alert("✨ Producto Especial inyectado con éxito.");
            };

            // IMPRIMIR PDF LISTA
            const printDocumentLista = () => {
                if(!activeListaId) return alert("Seleccioná una lista.");
                const listaActual = listas.find(l => l.id === activeListaId);
                const fecha = new Date().toLocaleDateString();
                const prodsLista = listaActual?.productos || [];
                const prodsOrdenados = [...prodsLista].sort((a,b) => (a.name || "").localeCompare(b.name || ""));
                const categories = [...new Set(prodsOrdenados.map(p => p.category || "VARIOS"))].sort();
                
                const bodyContent = `
                    <div style="font-family: sans-serif; padding: 10px;">
                        <h1 style="color: #1e3a8a; text-align: center; margin-bottom: 2px; text-transform: uppercase;">LISTA DE PRECIOS: ${listaActual.nombre_lista}</h1>
                        <p style="text-align: center; margin-top: 0; color: #475569;">DR DISTRIBUCIONES ROSARIO | ${fecha}</p>
                        <table style="width:100%; border-collapse:collapse; margin-top: 20px;">
                            ${categories.map(cat => `
                                <tr style="background:#f1f5f9;"><td colspan="3" style="padding:10px; font-weight:bold; border:1px solid #ddd; color:#1e3a8a; text-transform:uppercase; font-size:14px;">${cat}</td></tr>
                                ${prodsOrdenados.filter(p => (p.category || "VARIOS") === cat).map(p => `
                                    <tr>
                                        <td style="padding:10px; border-bottom:1px solid #ddd; text-align:left;">${p.name} ${p.es_oferta ? '<span style="color:red;font-weight:bold;">[OFERTA]</span>':''}</td>
                                        <td style="padding:10px; text-align:center; border-bottom:1px solid #ddd; color:#000;">x${p.pack || 1}</td>
                                        <td style="padding:10px; text-align:right; border-bottom:1px solid #ddd; font-weight:bold; color:#000;">$ ${(p.price || 0).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            `).join('')}
                        </table>
                    </div>
                `;

                const iframe = document.createElement('iframe');
                Object.assign(iframe.style, { position: 'fixed', right: '0', bottom: '0', width: '0', height: '0', border: '0', visibility: 'hidden' });
                document.body.appendChild(iframe);
                const doc = iframe.contentWindow.document;
                doc.write(`<html><body>${bodyContent}</body></html>`);
                doc.close();

                setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                    setTimeout(() => document.body.removeChild(iframe), 2500);
                }, 1000);
            };

            const registrarEnvioWsp = (cliente) => {
                const linkPersonalizado = `${window.location.origin}${window.location.pathname.replace('admin_v2.html', 'cliente_v2.html')}?id=${cliente.id}`;
                const msg = `Hola *${cliente.nombre}*! Te dejamos nuestro catálogo de pedidos actualizado con tus ofertas exclusivas. Armá tu pedido ingresando acá: ${linkPersonalizado}`;
                db.collection("v3_clientes").doc(cliente.id).update({ ultimo_envio: new Date().toISOString().split('T')[0] });
                window.open(`https://wa.me/${cliente.telefono}?text=${encodeURIComponent(msg)}`);
            };

            const compartirPresupuestadorWA = () => {
                const linkEspecial = `${window.location.origin}${window.location.pathname.replace('admin_v2.html', 'especial.html')}`;
                const msg = `Hola! Te dejamos nuestro *Catálogo y Presupuestador de Pedidos Especiales*. Podés armar tu lista de bultos y enviarnos tu solicitud de cotización ingresando acá:\n\n${linkEspecial}`;
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
            };

            // COTIZACIONES ESPECIALES
            const totalSolicitudCotizada = useMemo(() => {
                if (!selectedSolicitud) return 0;
                return selectedSolicitud.items.reduce((acc, item) => {
                    const desc = descuentosCotizacion[item.id] || 0;
                    const precioBase = item.precio_custom !== undefined ? item.precio_custom : (item.price || 0);
                    const precioConDesc = precioBase * (1 - desc / 100);
                    return acc + (item.cantidad * precioConDesc * (item.pack || 1));
                }, 0);
            }, [selectedSolicitud, descuentosCotizacion]);

            const enviarCotizacionEspecialWA = async () => {
                if (!selectedSolicitud) return;
                let msg = `*PRESUPUESTO ESPECIAL COTIZADO - DR DISTRIBUCIONES*\n\n`;
                msg += `*Cliente:* ${selectedSolicitud.cliente}\n`;
                msg += `\n---------------------------------------\n\n`;
                
                selectedSolicitud.items.forEach(item => {
                    const desc = descuentosCotizacion[item.id] || 0;
                    const precioBase = item.precio_custom !== undefined ? item.precio_custom : (item.price || 0);
                    const precioFinalUn = precioBase * (1 - desc / 100);
                    const subtotalItem = item.cantidad * precioFinalUn * (item.pack || 1);

                    msg += `• *${item.name}*\n`;
                    msg += `  ${item.cantidad} bultos x ${item.pack || 1} un.\n`;
                    msg += `  Precio Un: $${precioFinalUn.toFixed(2)}\n`;
                    msg += `  Subtotal: $${subtotalItem.toFixed(2)}\n\n`;
                });

                msg += `---------------------------------------\n`;
                msg += `*TOTAL NETO A PAGAR: $ ${totalSolicitudCotizada.toFixed(2)}*\n\n`;
                msg += `_Precios preferenciales cerrados por volumen._`;

                await db.collection("solicitudes").doc(selectedSolicitud.id).update({ estado: "cotizado" });
                setSelectedSolicitud(null);
                setDescuentosCotizacion({});
                window.open(`https://wa.me/5493416384086?text=${encodeURIComponent(msg)}`);
            };

            // CUENTAS CORRIENTES Y MOVIMIENTOS
            const handleGuardarMovimiento = async (e) => {
                e.preventDefault();
                const f = e.target;
                if (!selectedClienteCuenta) return alert("Seleccioná un cliente.");

                await db.collection("v3_movimientos").add({
                    cliente_id: selectedClienteCuenta,
                    tipo: f.m_tipo.value,
                    nro_factura: f.m_factura.value.trim(),
                    fecha: f.m_fecha.value,
                    monto: parseMoney(f.m_monto.value),
                    observaciones: f.m_obs.value.trim(),
                    fecha_registro: new Date().toISOString()
                });

                f.reset();
                alert("Movimiento registrado.");
            };

            const clienteCuentaSeleccionadoObj = useMemo(() => {
                return clientesConSaldoCalculado.find(c => c.id === selectedClienteCuenta);
            }, [clientesConSaldoCalculado, selectedClienteCuenta]);

            const movimientosClienteActual = useMemo(() => {
                if (!selectedClienteCuenta) return [];
                return movimientos.filter(m => m.cliente_id === selectedClienteCuenta)
                                  .sort((a,b) => (b.fecha || "").localeCompare(a.fecha || ""));
            }, [movimientos, selectedClienteCuenta]);

            const saldoClienteActual = useMemo(() => {
                return clienteCuentaSeleccionadoObj?.saldo || 0;
            }, [clienteCuentaSeleccionadoObj]);

            const cobrosDelMes = useMemo(() => {
                return movimientos.filter(m => m.tipo === 'COBRO' && m.fecha && m.fecha.startsWith(mesComision));
            }, [movimientos, mesComision]);

            const totalCobradoMes = useMemo(() => {
                return cobrosDelMes.reduce((acc, m) => acc + (m.monto || 0), 0);
            }, [cobrosDelMes]);

            const comisionCalculada = useMemo(() => {
                return totalCobradoMes * (pctComision / 100);
            }, [totalCobradoMes, pctComision]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-200 text-slate-950 font-medium">
                    <header className="bg-slate-950 text-white p-6 shadow-xl flex justify-between items-center border-b-4 border-blue-600">
                        <div>
                            <h1 className="text-3xl font-black tracking-tight text-blue-400">VentasIQ Master <span className="text-white text-xs px-3 py-1 bg-blue-600 rounded-md ml-2 font-bold uppercase tracking-widest">CRM v3</span></h1>
                            <p className="text-sm text-slate-300 font-bold mt-0.5">Gestión Comercial & Cuentas Corrientes — DR Distribuciones</p>
                        </div>
                    </header>

                    <nav className="bg-white border-b-4 border-slate-300 flex p-1.5 sticky top-0 z-40 shadow-md text-xs font-black uppercase tracking-wider overflow-x-auto">
                        <button onClick={() => setActiveTab('crm')} className={`flex-1 min-w-[140px] py-3.5 text-center rounded-xl transition ${activeTab === 'crm' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>📊 CRM & Agenda ({agendaHoyFiltrada.length})</button>
                        <button onClick={() => setActiveTab('clientes')} className={`flex-1 min-w-[140px] py-3.5 text-center rounded-xl transition ${activeTab === 'clientes' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>👥 Cartera Clientes ({clientes.length})</button>
                        <button onClick={() => setActiveTab('listas')} className={`flex-1 min-w-[140px] py-3.5 text-center rounded-xl transition ${activeTab === 'listas' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>📋 Gestión Listas</button>

                                    <div className="flex justify-between items-center border-b border-purple-800 pb-2">
                                        <h3 className="font-black text-sm uppercase tracking-wider text-purple-300">💤 Alerta de Clientes Inactivos (Sin movimientos este mes)</h3>
                                        <span className="bg-purple-800 text-purple-200 font-black text-xs px-3 py-1 rounded-full">{clientesInactivosMes.length} Inactivos</span>
                                    </div>
                                    <p className="text-xs text-purple-200 font-bold">Estos clientes no registran compras ni pagos en lo que va del mes. Hacé clic para escribirles:</p>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-48 overflow-y-auto pr-1">
                                        {clientesInactivosMes.length === 0 ? (
                                            <p className="col-span-3 text-center py-4 text-xs font-black uppercase text-purple-300">🎉 ¡Excelente! Todos los clientes han tenido al menos un movimiento este mes.</p>
                                        ) : (
                                            clientesInactivosMes.map(c => (
                                                <div key={c.id} className="bg-purple-900/60 p-3 rounded-xl border border-purple-700 flex justify-between items-center">
                                                    <div className="truncate mr-2">
                                                        <div className="font-black text-xs text-white truncate">{c.nombre}</div>
                                                        <div className="text-[10px] text-purple-300 truncate">📍 {c.direccion || 'Sin direcc.'}</div>
                                                    </div>
                                                    <button onClick={() => registrarEnvioWsp(c)} className="bg-green-600 hover:bg-green-700 text-white font-black text-[10px] px-2.5 py-1.5 rounded-lg uppercase shadow shrink-0">
                                                        💬 Contactar
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* COLUMNA IZQUIERDA: LISTADO GENERAL DE SALDOS CON FILTROS STRICTOS */}
                                    <div className="lg:col-span-1 bg-white p-6 border-2 border-slate-400 rounded-3xl shadow-md h-fit text-xs font-bold space-y-4">
                                        <h3 className="font-black text-slate-950 uppercase text-xs text-blue-900 border-b pb-2">📊 Resumen General de Saldos</h3>
                                        
                                        {/* BUSCADOR + BOTONES DE FILTRO */}
                                        <div className="space-y-2">
                                            <input 
                                                type="text" 
                                                placeholder="🔍 Filtrar lista por nombre o direcc..." 
                                                className="w-full p-2.5 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold text-slate-950 outline-none text-xs"
                                                value={searchClienteCuentaQuery}
                                                onChange={e => setSearchClienteCuentaQuery(e.target.value)}
                                            />
                                            <div className="flex gap-1 text-[10px] font-black uppercase">
                                                <button onClick={() => setSaldoFiltroTipo('TODOS')} className={`flex-1 py-1.5 rounded-lg border transition ${saldoFiltroTipo === 'TODOS' ? 'bg-slate-950 text-white border-slate-950' : 'bg-slate-100 text-slate-700'}`}>Todos</button>
                                                <button onClick={() => setSaldoFiltroTipo('DEUDORES')} className={`flex-1 py-1.5 rounded-lg border transition ${saldoFiltroTipo === 'DEUDORES' ? 'bg-red-600 text-white border-red-700' : 'bg-slate-100 text-slate-700'}`}>Deudores</button>
                                                <button onClick={() => setSaldoFiltroTipo('FAVOR')} className={`flex-1 py-1.5 rounded-lg border transition ${saldoFiltroTipo === 'FAVOR' ? 'bg-green-600 text-white border-green-700' : 'bg-slate-100 text-slate-700'}`}>A Favor</button>
                                            </div>
                                        </div>

                                        {/* TABLA RESUMEN DE SALDOS CORREGIDA */}
                                        <div className="max-h-80 overflow-y-auto divide-y-2 divide-slate-100 border-2 border-slate-200 rounded-2xl">
                                            {clientesSaldosFiltrados.length === 0 ? (
                                                <p className="p-4 text-center text-slate-400 font-black uppercase text-[10px]">No se encontraron clientes con este filtro</p>
                                            ) : (
                                                clientesSaldosFiltrados.map(c => (
                                                    <div 
                                                        key={c.id} 
                                                        onClick={() => setSelectedClienteCuenta(c.id)} 
                                                        className={`p-3 cursor-pointer transition flex justify-between items-center ${selectedClienteCuenta === c.id ? 'bg-blue-100 border-l-4 border-blue-600' : 'hover:bg-slate-50'}`}
                                                    >
                                                        <div className="truncate mr-2">
                                                            <div className="font-black text-slate-950 truncate">{c.nombre}</div>
                                                            <div className="text-[10px] text-slate-500 truncate">📍 {c.direccion || 'Sin direcc.'}</div>
                                                        </div>
                                                        {/* COLORIMETRÍA CORREGIDA: Excluye el cero absoluto */}
                                                        <span className={`font-black text-xs shrink-0 ${c.saldo > 0.001 ? 'text-red-600' : (c.saldo < -0.001 ? 'text-green-600' : 'text-slate-400')}`}>
                                                            $ {c.saldo.toFixed(2)}
                                                        </span>
                                                    </div>
                                                ))
                                            )}
                                        </div>

                                        {/* REGISTRO DE MOVIMIENTOS SI HAY CLIENTE SELECCIONADO */}
                                        {selectedClienteCuenta && (
                                            <form onSubmit={handleGuardarMovimiento} className="space-y-3 pt-3 border-t-2 border-slate-300">
                                                <h4 className="font-black uppercase text-[11px] text-slate-800">➕ Cargar Factura o Cobro</h4>
                                                <div>
                                                    <select name="m_tipo" className="w-full p-2.5 bg-slate-50 border-2 border-slate-950 rounded-xl font-black text-slate-950">
                                                        <option value="FACTURA">📄 FACTURA / VENTA REAL</option>
                                                        <option value="COBRO">💵 COBRO / PAGO RECIBIDO</option>
                                                    </select>
                                                </div>
                                                <div><input name="m_factura" placeholder="N° Factura / Remito (Opcional)" className="w-full p-2.5 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" /></div>
                                                <div><input type="date" name="m_fecha" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-2.5 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" required /></div>
                                                <div><input name="m_monto" placeholder="Monto ($)" className="w-full p-2.5 bg-slate-50 border-2 border-blue-600 rounded-xl font-black text-blue-900 text-sm" required /></div>
                                                <div><input name="m_obs" placeholder="Observaciones / Medio de Pago" className="w-full p-2.5 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" /></div>
                                                <button type="submit" className="w-full bg-slate-950 text-white p-3 rounded-xl font-black uppercase text-xs shadow-md">Imputar en Cuenta</button>
                                            </form>
                                        )}
                                    </div>

                                    {/* COLUMNA DERECHA: ESTADO DETALLADO DEL CLIENTE + LIQUIDACIÓN COMISIONES */}
                                    <div className="lg:col-span-2 space-y-6">
                                        <div className="bg-white border-2 border-slate-400 rounded-3xl shadow-md p-6 overflow-hidden">
                                            {selectedClienteCuenta ? (
                                                <>
                                                    <div className="flex justify-between items-center border-b pb-4 mb-4">
                                                        <div>
                                                            <h3 className="font-black text-slate-950 text-xl">{clienteCuentaSeleccionadoObj?.nombre}</h3>
                                                            <p className="text-xs text-slate-600 font-bold">📍 {clienteCuentaSeleccionadoObj?.direccion || 'Sin dirección'}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 block">Saldo Pendiente</span>
                                                            <span className={`text-2xl font-black ${saldoClienteActual > 0.001 ? 'text-red-600' : (saldoClienteActual < -0.001 ? 'text-green-600' : 'text-slate-400')}`}>$ {saldoClienteActual.toFixed(2)}</span>
                                                        </div>
                                                    </div>

                                                    <table className="w-full text-left border-collapse text-xs">
                                                        <thead className="bg-slate-950 text-white text-[10px] uppercase font-bold tracking-widest">
                                                            <tr>
                                                                <th className="p-3">Fecha / Tipo</th>
                                                                <th className="p-3">Detalle / Factura</th>
                                                                <th className="p-3 text-right">Monto</th>
                                                                <th className="p-3 text-right">Acción</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y font-bold">
                                                            {movimientosClienteActual.length === 0 ? (
                                                                <tr><td colSpan="4" className="p-8 text-center text-slate-400 uppercase">Sin movimientos registrados</td></tr>
                                                            ) : (
                                                                movimientosClienteActual.map(m => (
                                                                    <tr key={m.id} className="hover:bg-slate-50">
                                                                        <td className="p-3">
                                                                            <span className="font-black text-slate-950">{m.fecha}</span>
                                                                            <br/>
                                                                            <span className={`text-[9px] font-black px-2 py-0.5 rounded-md uppercase ${m.tipo === 'FACTURA' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>{m.tipo}</span>
                                                                        </td>
                                                                        <td className="p-3 text-slate-800">
                                                                            {m.nro_factura && <span className="font-black block">{m.nro_factura}</span>}
                                                                            <span className="text-slate-600 text-[11px]">{m.observaciones || '---'}</span>
                                                                        </td>
                                                                        <td className={`p-3 text-right font-black text-sm ${m.tipo === 'FACTURA' ? 'text-slate-950' : 'text-green-700'}`}>
                                                                            {m.tipo === 'FACTURA' ? `+$ ${m.monto.toFixed(2)}` : `-$ ${m.monto.toFixed(2)}`}
                                                                        </td>
                                                                        <td className="p-3 text-right">
                                                                            <button onClick={async () => { if(confirm("¿Eliminar movimiento?")) db.collection("v3_movimientos").doc(m.id).delete(); }} className="text-red-500 font-bold uppercase text-[10px]">Borrar</button>
                                                                        </td>
                                                                    </tr>
                                                                ))
                                                            )}
                                                        </tbody>
                                                    </table>
                                                </>
                                            ) : (
                                                <div className="py-16 text-center text-slate-400 font-black uppercase text-xs">
                                                    👈 Tocá un cliente de la lista de la izquierda para abrir su Estado de Cuenta y cargar movimientos.
                                                </div>
                                            )}
                                        </div>

                                        {/* CALCULADORA DE COMISIONES POR VENTA COBRADA */}
                                        <div className="bg-slate-950 text-white p-6 rounded-3xl shadow-xl space-y-4 border-b-4 border-blue-600">
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                                <h3 className="font-black text-sm uppercase tracking-wider text-blue-400">📊 Liquidación de Comisiones Mensuales</h3>
                                                <div className="flex items-center gap-2">
                                                    <input type="month" className="p-2 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none" value={mesComision} onChange={e => setMesComision(e.target.value)} />
                                                    <div className="flex items-center gap-1 bg-slate-900 border border-slate-700 p-2 rounded-xl">
                                                        <span className="text-xs font-bold">%</span>
                                                        <input type="number" className="w-12 bg-transparent font-black text-xs text-center text-blue-400 outline-none" value={pctComision} onChange={e => setPctComision(parseFloat(e.target.value) || 0)} />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4 text-center pt-2">
                                                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                                    <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Total Venta Cobrada en el Mes</span>
                                                    <span className="text-2xl font-black text-white">$ {totalCobradoMes.toFixed(2)}</span>
                                                </div>
                                                <div className="bg-blue-600 p-4 rounded-2xl border border-blue-500 shadow-md">
                                                    <span className="text-[10px] uppercase font-bold text-blue-100 block mb-1">Comisión a Cobrar ({pctComision}%)</span>
                                                    <span className="text-2xl font-black text-white">$ {comisionCalculada.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
