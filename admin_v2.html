<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentasIQ Master | Panel de Control CRM</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        @media print { #root { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyABBIDqDnx-yu75601EQZ-yQ_VNkbdApGY",
            authDomain: "dr-ccs.firebaseapp.com",
            projectId: "dr-ccs",
            storageBucket: "dr-ccs.firebasestorage.app",
            messagingSenderId: "715483746859",
            appId: "1:715483746859:web:b3355feaa35baf709dd06e"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const App = () => {
            const [activeTab, setActiveTab] = useState('crm');
            const [clientes, setClientes] = useState([]);
            const [listas, setListas] = useState([]);
            
            // Controles de estados
            const [editingCliente, setEditingCliente] = useState(null);
            const [activeListaId, setActiveListaId] = useState("");
            const [bulkData, setBulkData] = useState("");
            const [bulkClientesData, setBulkClientesData] = useState("");
            const [clienteSearch, setClienteSearch] = useState("");
            const [listaSearch, setListaSearch] = useState("");

            // Carga de datos en tiempo real V3
            useEffect(() => {
                const unsubClientes = db.collection("v3_clientes").onSnapshot(s => 
                    setClientes(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                const unsubListas = db.collection("v3_listas").onSnapshot(s => 
                    setListas(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                return () => { unsubClientes(); unsubListas(); };
            }, []);

            // CRM: Alertas de Agenda Comercial
            const agendaHoy = useMemo(() => {
                const hoy = new Date();
                return clientes.map(c => {
                    const ultEnvio = c.ultimo_envio ? new Date(c.ultimo_envio) : null;
                    const ultVisita = c.ultimo_visita ? new Date(c.ultimo_visita) : null;
                    const diasDesdeEnvio = ultEnvio ? Math.floor((hoy - ultEnvio) / (1000 * 60 * 60 * 24)) : 999;
                    const diasDesdeVisita = ultVisita ? Math.floor((hoy - ultVisita) / (1000 * 60 * 60 * 24)) : 999;

                    return {
                        ...c,
                        tocaEnvio: diasDesdeEnvio >= (parseInt(c.frecuencia_envio) || 7),
                        tocaVisita: diasDesdeVisita >= (parseInt(c.frecuencia_visita) || 15),
                        diasDesdeEnvio,
                        diasDesdeVisita
                    };
                }).filter(c => c.tocaEnvio || c.tocaVisita);
            }, [clientes]);

            // Buscador inteligente para la Cartera de Clientes
            const clientesFiltrados = useMemo(() => {
                const query = clienteSearch.toLowerCase().trim();
                return clientes.filter(c => {
                    const nombreMatch = (c.nombre || "").toLowerCase().includes(query);
                    const direccMatch = (c.direccion || "").toLowerCase().includes(query);
                    const nombreLista = listas.find(l => l.id === c.lista_id)?.nombre_lista || "Base General";
                    const listaMatch = nombreLista.toLowerCase().includes(query);
                    return nombreMatch || direccMatch || listaMatch;
                });
            }, [clientes, clienteSearch, listas]);

            const parseMoney = (val) => {
                if (val === undefined || val === null) return 0;
                let clean = val.toString().replace("$", "").replace(/\./g, "").replace(",", ".");
                let parsed = parseFloat(clean);
                return isNaN(parsed) ? 0 : parsed;
            };

            // CRUD Clientes Individual
            const handleSaveCliente = async (e) => {
                e.preventDefault();
                const f = e.target;
                const id = editingCliente ? editingCliente.id : "cli_" + Date.now();
                await db.collection("v3_clientes").doc(id).set({
                    nombre: f.c_nombre.value,
                    telefono: f.c_telefono.value,
                    direccion: f.c_direccion.value,
                    lista_id: f.c_lista.value,
                    descuento_extra: parseFloat(f.c_desc.value) || 0,
                    frecuencia_envio: parseInt(f.c_frec_envio.value) || 7,
                    frecuencia_visita: parseInt(f.c_frec_visita.value) || 14,
                    ultimo_envio: editingCliente?.ultimo_envio || "",
                    ultimo_visita: editingCliente?.ultimo_visita || ""
                }, { merge: true });
                setEditingCliente(null);
                f.reset();
            };

            // Importación Masiva de Clientes con Descuento
            const handleBulkClientesImport = async () => {
                const rows = bulkClientesData.trim().split("\n");
                const batch = db.batch();
                
                rows.forEach(row => {
                    const cols = row.split("\t");
                    if (cols.length >= 2) {
                        const id = "cli_" + (Date.now() + Math.random()).toString().replace(".","");
                        const nombreListaExcel = cols[3] ? cols[3].trim().toUpperCase() : "";
                        const listaEncontrada = listas.find(l => l.nombre_lista.toUpperCase() === nombreListaExcel);
                        const descExtra = cols[4] ? parseFloat(cols[4].replace("%", "").trim()) || 0 : 0;
                        
                        batch.set(db.collection("v3_clientes").doc(id), {
                            nombre: cols[0].trim(),
                            telefono: cols[1].trim().replace("+", ""),
                            direccion: cols[2] ? cols[2].trim() : "",
                            lista_id: listaEncontrada ? listaEncontrada.id : "", 
                            descuento_extra: descExtra,
                            frecuencia_envio: 7, 
                            frecuencia_visita: 14, 
                            ultimo_envio: "",
                            ultimo_visita: ""
                        });
                    }
                });
                await batch.commit();
                setBulkClientesData("");
                alert("Cartera de clientes importada y vinculada de forma exitosa.");
            };

            // Creación de una nueva Lista Comercial
            const handleCreateLista = async () => {
                const nombre = prompt("Nombre de la nueva Lista de Precios (Ej: MAYORISTA, SUPERMERCADOS):");
                if(!nombre) return;
                const id = "lista_" + Date.now();
                await db.collection("v3_listas").doc(id).set({
                    nombre_lista: nombre.toUpperCase().trim(),
                    productos: []
                });
            };

            // Importación masiva de Productos DIRECTO adentro de la Lista seleccionada
            const handleBulkProductosListaImport = async () => {
                if(!activeListaId) {
                    alert("⚠️ Por favor, seleccioná primero una Lista de la izquierda para poder inyectarle el Excel.");
                    return;
                }

                const rows = bulkData.trim().split("\n");
                const listaActual = listas.find(l => l.id === activeListaId);
                let productosActuales = listaActual?.productos ? [...listaActual.productos] : [];

                rows.forEach(row => {
                    const cols = row.split("\t");
                    if (cols.length >= 2) {
                        const prodId = "prod_" + (Date.now() + Math.random()).toString().replace(".","");
                        productosActuales.push({
                            id: prodId,
                            name: cols[0].trim(),
                            price: parseMoney(cols[1]),
                            pack: parseInt(cols[2]) || 1,
                            category: (cols[3] || "VARIOS").trim().toUpperCase(),
                            imageUrl: cols[4] ? cols[4].trim() : "",
                            es_oferta: cols[5] ? cols[5].trim().toUpperCase() === "SI" : false
                        });
                    }
                });

                await db.collection("v3_listas").doc(activeListaId).update({ productos: productosActuales });
                setBulkData("");
                alert(`¡Éxito! Se cargaron los productos y precios específicos dentro de la lista.`);
            };

            // Editar propiedades de un producto dentro de su lista
            const handleEditProductoInLista = async (p) => {
                const nuevoPrecioInput = prompt(`Editar precio para "${p.name}":`, p.price);
                if (nuevoPrecioInput === null) return;
                const nuevoPrecio = parseMoney(nuevoPrecioInput);

                const nuevoPack = parseInt(prompt("Unidades por bulto (Pack):", p.pack)) || 1;
                const esOfertaInput = prompt("¿Está en Oferta? (Escribir SI o NO):", p.es_oferta ? "SI" : "NO");
                const nuevaOferta = esOfertaInput ? esOfertaInput.trim().toUpperCase() === "SI" : false;

                const listaActual = listas.find(l => l.id === activeListaId);
                const productosActualizados = listaActual.productos.map(item => {
                    if (item.id === p.id) {
                        return { ...item, price: nuevoPrecio, pack: nuevoPack, es_oferta: nuevaOferta };
                    }
                    return item;
                });

                await db.collection("v3_listas").doc(activeListaId).update({ productos: productosActualizados });
                alert("Producto actualizado correctamente.");
            };

            // Agregar Producto Especial (Temporal)
            const addTemporalProductToList = () => {
                if(!activeListaId) return alert("Seleccioná primero una lista.");
                const name = prompt("Descripción del producto especial:");
                const priceInput = prompt("Precio unitario:");
                if (!name || !priceInput) return;
                const price = parseMoney(priceInput);
                const pack = parseInt(prompt("Unidades por bulto:")) || 1;
                
                const listaActual = listas.find(l => l.id === activeListaId);
                let productosActuales = listaActual?.productos ? [...listaActual.productos] : [];
                
                productosActuales.push({
                    id: "temp_" + Date.now(),
                    name: "(ESPECIAL) " + name,
                    price: price,
                    pack: pack,
                    category: "ESPECIALES",
                    es_oferta: false,
                    isTemp: true
                });

                db.collection("v3_listas").doc(activeListaId).update({ productos: productosActuales });
                alert("Producto especial inyectado en esta lista.");
            };

            // Descarga de PDF de la Lista Seleccionada
            const printDocumentLista = () => {
                if(!activeListaId) return alert("Seleccioná una lista.");
                const listaActual = listas.find(l => l.id === activeListaId);
                const fecha = new Date().toLocaleDateString();
                
                const prodsLista = listaActual?.productos || [];
                const prodsOrdenados = [...prodsLista].sort((a,b) => (a.name || "").localeCompare(b.name || ""));
                const categories = [...new Set(prodsOrdenados.map(p => p.category || "VARIOS"))].sort();
                
                const bodyContent = `
                    <div style="font-family: sans-serif; padding: 10px;">
                        <h1 style="color: #1e3a8a; text-align: center; margin-bottom: 2px; text-transform: uppercase;">LISTA DE PRECIOS: ${listaActual.nombre_lista}</h1>
                        <p style="text-align: center; margin-top: 0; color: #475569;">DR DISTRIBUCIONES ROSARIO | ${fecha}</p>
                        <table style="width:100%; border-collapse:collapse; margin-top: 20px;">
                            ${categories.map(cat => `
                                <tr style="background:#f1f5f9;"><td colspan="3" style="padding:10px; font-weight:bold; border:1px solid #ddd; color:#1e3a8a; text-transform:uppercase; font-size:14px;">${cat}</td></tr>
                                ${prodsOrdenados.filter(p => (p.category || "VARIOS") === cat).map(p => `
                                    <tr>
                                        <td style="padding:10px; border-bottom:1px solid #ddd; text-align:left;">${p.name} ${p.es_oferta ? '<span style="color:red;font-weight:bold;">[OFERTA]</span>':''}</td>
                                        <td style="padding:10px; text-align:center; border-bottom:1px solid #ddd; color:#000;">x${p.pack || 1}</td>
                                        <td style="padding:10px; text-align:right; border-bottom:1px solid #ddd; font-weight:bold; color:#000;">$ ${(p.price || 0).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            `).join('')}
                        </table>
                    </div>
                `;

                const iframe = document.createElement('iframe');
                Object.assign(iframe.style, { position: 'fixed', right: '0', bottom: '0', width: '0', height: '0', border: '0', visibility: 'hidden' });
                document.body.appendChild(iframe);
                const doc = iframe.contentWindow.document;
                doc.write(`<html><body>${bodyContent}</body></html>`);
                doc.close();

                setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                    setTimeout(() => document.body.removeChild(iframe), 2500);
                }, 1000);
            };

            const registrarEnvioWsp = (cliente) => {
                const linkPersonalizado = `${window.location.origin}${window.location.pathname.replace('admin_v2.html', 'cliente_v2.html')}?id=${cliente.id}`;
                const msg = `Hola *${cliente.nombre}*! Te dejamos nuestro catálogo de pedidos actualizado con tus ofertas exclusivas. Armá tu pedido ingresando acá: ${linkPersonalizado}`;
                db.collection("v3_clientes").doc(cliente.id).update({ ultimo_envio: new Date().toISOString().split('T')[0] });
                window.open(`https://wa.me/${cliente.telefono}?text=${encodeURIComponent(msg)}`);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-200 text-slate-950 font-medium">
                    <header className="bg-slate-950 text-white p-6 shadow-xl flex justify-between items-center border-b-4 border-blue-600">
                        <div>
                            <h1 className="text-3xl font-black tracking-tight text-blue-400">VentasIQ Master <span className="text-white text-xs px-3 py-1 bg-blue-600 rounded-md ml-2 font-bold uppercase tracking-widest">CRM v3</span></h1>
                            <p className="text-sm text-slate-300 font-bold mt-0.5">Control Comercial de Listas Independientes — DR Distribuciones</p>
                        </div>
                    </header>

                    <nav className="bg-white border-b-4 border-slate-300 flex p-2 sticky top-0 z-40 shadow-md text-xs font-black uppercase tracking-wider">
                        <button onClick={() => setActiveTab('crm')} className={`flex-1 py-4 text-center rounded-xl transition ${activeTab === 'crm' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>📊 CRM & Agenda ({agendaHoy.length})</button>
                        <button onClick={() => setActiveTab('clientes')} className={`flex-1 py-4 text-center rounded-xl transition ${activeTab === 'clientes' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>👥 Cartera Clientes ({clientes.length})</button>
                        <button onClick={() => setActiveTab('listas')} className={`flex-1 py-4 text-center rounded-xl transition ${activeTab === 'listas' ? 'bg-blue-600 text-white shadow-md font-black scale-102' : 'text-slate-800 hover:bg-slate-100'}`}>📋 Gestión de Listas de Precios</button>
                    </nav>

                    <main className="p-4 md:p-8 max-w-6xl mx-auto w-full flex-1">
                        
                        {/* TAB 1: CRM */}
                        {activeTab === 'crm' && (
                            <section className="space-y-6">
                                <div className="bg-white border-2 border-slate-400 rounded-3xl shadow-lg p-6">
                                    <h3 className="font-black text-slate-950 mb-4 uppercase text-xs tracking-widest text-blue-900 border-b pb-2">Hojas de Ruta y Envíos Pendientes</h3>
                                    {agendaHoy.length === 0 ? (
                                        <p className="text-center py-10 text-base text-slate-500 font-black uppercase">🎉 Agenda comercial al día.</p>
                                    ) : (
                                        <div className="divide-y-2 divide-slate-200">
                                            {agendaHoy.map(c => (
                                                <div key={c.id} className="py-4 flex flex-col md:flex-row justify-between md:items-center gap-4">
                                                    <div>
                                                        <h4 className="font-black text-slate-950 text-base">{c.nombre}</h4>
                                                        <p className="text-xs text-slate-800 font-bold">📍 {c.direccion || 'Sin dirección'} | 📋 {listas.find(l=>l.id===c.lista_id)?.nombre_lista || "Base"}</p>
                                                        <div className="flex gap-2 mt-2">
                                                            {c.tocaEnvio && <span className="bg-green-200 text-green-950 font-black text-[10px] px-2.5 py-1 rounded-md border border-green-400 uppercase">📋 Catálogo Pendiente</span>}
                                                            {c.tocaVisita && <span className="bg-purple-200 text-purple-950 font-black text-[10px] px-2.5 py-1 rounded-md border border-purple-400 uppercase">🚗 Visita Requerida</span>}
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => registrarEnvioWsp(c)} className="bg-green-600 hover:bg-green-700 text-white font-black text-xs px-5 py-3 rounded-xl shadow-md uppercase tracking-wider">💬 WhatsApp</button>
                                                        <button onClick={async () => { await db.collection("v3_clientes").doc(c.id).update({ ultimo_visita: new Date().toISOString().split('T')[0] }); }} className="bg-slate-900 text-white font-black text-xs px-5 py-3 rounded-xl shadow-md uppercase tracking-wider">🚗 Visitar</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </section>
                        )}

                        {/* TAB 2: CARTERA CLIENTES */}
                        {activeTab === 'clientes' && (
                            <section className="space-y-6">
                                <div className="bg-blue-50 p-6 rounded-3xl border-2 border-blue-400 shadow-md">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-black text-blue-950 text-sm uppercase tracking-wider">📋 Importación Masiva de Clientes con Descuento (Excel)</h3>
                                        <button onClick={async () => { if(confirm("¿Vaciar clientes?")) db.collection("v3_clientes").get().then(s=>s.forEach(d=>d.ref.delete())); }} className="bg-red-600 text-white font-black text-[10px] uppercase px-4 py-2 rounded-xl border border-red-800">🗑️ Vaciar Cartera</button>
                                    </div>
                                    <div className="bg-blue-950 p-3 rounded-xl border-2 border-slate-950 font-mono text-[11px] font-black text-cyan-400 mb-3 text-center tracking-wide shadow-inner">
                                        Nombre Cliente [TAB] WhatsApp [TAB] Dirección [TAB] Nombre exacto de la Lista [TAB] Descuento % (Ej: 5.5 o dejar vacío)
                                    </div>
                                    <textarea className="w-full h-24 p-4 rounded-2xl border-2 border-slate-950 text-xs font-mono outline-none bg-white text-slate-950 font-bold" placeholder="Pega clientes desde Excel..." value={bulkClientesData} onChange={e => setBulkClientesData(e.target.value)} />
                                    <button onClick={handleBulkClientesImport} className="w-full bg-slate-950 text-white py-3.5 rounded-xl mt-2 font-black uppercase text-xs tracking-widest shadow-md">Subir Cartera de Clientes con Descuentos</button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-1 bg-white p-6 border-2 border-slate-400 rounded-3xl shadow-md h-fit text-xs font-bold">
                                        <h3 className="font-black text-slate-950 mb-4 uppercase text-xs text-blue-900 border-b pb-1">{editingCliente ? "📝 Editar Ficha" : "👤 Registrar Cliente Individual"}</h3>
                                        <form onSubmit={handleSaveCliente} className="space-y-3">
                                            <div><label className="text-slate-950 block mb-1">Razón Social</label><input name="c_nombre" defaultValue={editingCliente?.nombre} className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" required /></div>
                                            <div><label className="text-slate-950 block mb-1">WhatsApp</label><input name="c_telefono" defaultValue={editingCliente?.telefono} placeholder="549341..." className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" required /></div>
                                            <div><label className="text-slate-950 block mb-1">Dirección</label><input name="c_direccion" defaultValue={editingCliente?.direccion} className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" /></div>
                                            <div>
                                                <label className="text-slate-950 block mb-1">Vincular a Lista Comercial</label>
                                                <select name="c_lista" defaultValue={editingCliente?.lista_id} className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-black text-slate-950">
                                                    <option value="">-- SELECCIONÁ LA LISTA --</option>
                                                    {listas.map(l => <option key={l.id} value={l.id}>{l.nombre_lista}</option>)}
                                                </select>
                                            </div>
                                            <div><label className="text-slate-950 block mb-1">Descuento Extra Ficha (%)</label><input type="number" step="0.01" name="c_desc" defaultValue={editingCliente?.descuento_extra} placeholder="0" className="w-full p-3 bg-slate-50 border-2 border-blue-600 rounded-xl font-black text-blue-600 text-sm" /></div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div><label className="text-slate-950 block mb-1">Catálogo (Días)</label><input type="number" name="c_frec_envio" defaultValue={editingCliente?.frecuencia_envio || 7} className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" /></div>
                                                <div><label className="text-slate-950 block mb-1">Visita (Días)</label><input type="number" name="c_frec_visita" defaultValue={editingCliente?.frecuencia_visita || 14} className="w-full p-3 bg-slate-50 border-2 border-slate-950 rounded-xl font-bold" /></div>
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 text-white p-3.5 rounded-xl font-black uppercase mt-2 shadow-md">Guardar Cliente</button>
                                        </form>
                                    </div>

                                    <div className="lg:col-span-2 bg-white border-2 border-slate-400 rounded-3xl shadow-md overflow-hidden">
                                        <div className="p-4 bg-slate-100 border-b-2 border-slate-300 shadow-inner flex items-center">
                                            <input type="text" placeholder="🔍 Buscar clientes por nombre, dirección o lista asignada..." className="w-full p-3 border-2 border-slate-950 rounded-xl text-xs font-bold text-slate-950 outline-none" value={clienteSearch} onChange={e => setClienteSearch(e.target.value)} />
                                        </div>
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead className="bg-slate-950 text-white text-[10px] uppercase font-bold tracking-widest">
                                                <tr><th className="p-4">Cliente / Regla Comercial</th><th className="p-4 text-right">Acciones</th></tr>
                                            </thead>
                                            <tbody className="divide-y-2 divide-slate-100 font-bold">
                                                {clientesFiltrados.map(c => (
                                                    <tr key={c.id} className="hover:bg-slate-50">
                                                        <td className="p-4">
                                                            <div className="font-black text-slate-950 text-base">{c.nombre}</div>
                                                            <div className="text-blue-900 font-extrabold mt-0.5">📋 Lista: {listas.find(l=>l.id===c.lista_id)?.nombre_lista || "No asignada"} {c.descuento_extra > 0 && `(-${c.descuento_extra}%)`}</div>
                                                            <div className="text-slate-600 text-[11px] mt-0.5">📍 {c.direccion || 'Sin direcc.'} | 📞 {c.telefono}</div>
                                                        </td>
                                                        <td className="p-4 text-right space-x-3 font-black uppercase text-xs">
                                                            <button onClick={() => {
                                                                const link = `${window.location.origin}${window.location.pathname.replace('admin_v2.html', 'cliente_v2.html')}?id=${c.id}`;
                                                                navigator.clipboard.writeText(link);
                                                                alert("¡Link copiado!");
                                                            }} className="text-blue-600 hover:underline">🔗 Link</button>
                                                            <button onClick={() => setEditingCliente(c)} className="text-slate-700">Editar</button>
                                                            <button onClick={() => { if(confirm("¿Eliminar?")) db.collection("v3_clientes").doc(c.id).delete(); }} className="text-red-500">Borrar</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* TAB 3: GESTION DE LISTAS */}
                        {activeTab === 'listas' && (
                            <section className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 border-2 border-slate-400 rounded-2xl shadow-md">
                                    <div>
                                        <h3 className="font-black text-slate-950 text-sm uppercase tracking-wider">Módulo de Listas de Precios Independientes</h3>
                                        <p className="text-xs text-slate-600 font-bold mt-0.5">Cada lista contiene sus propios productos cargados desde Excel de forma autónoma.</p>
                                    </div>
                                    <button onClick={handleCreateLista} className="bg-blue-600 text-white font-black text-xs px-5 py-3 rounded-xl uppercase tracking-wider shadow-md">➕ Crear Nueva Lista</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="md:col-span-1 bg-white border-2 border-slate-400 rounded-2xl p-4 space-y-2 shadow-md">
                                        <h4 className="text-[10px] uppercase font-black text-slate-400 tracking-wider">Seleccionar Lista:</h4>
                                        {listas.map(l => (
                                            <button key={l.id} onClick={() => setActiveListaId(l.id)} className={`w-full text-left p-3.5 rounded-xl font-black text-xs transition uppercase tracking-wider ${activeListaId === l.id ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 border border-slate-300 text-slate-900 hover:bg-slate-200'}`}>📦 {l.nombre_lista} ({l.productos?.length || 0} items)</button>
                                        ))}
                                    </div>

                                    <div className="md:col-span-3 space-y-4">
                                        {activeListaId ? (
                                            <>
                                                <div className="bg-orange-50 p-6 rounded-3xl border-2 border-orange-400 shadow-md">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <h3 className="font-black text-orange-950 text-sm uppercase tracking-wider">📥 Inyectar Excel de Productos a: <span className="text-blue-700">{listas.find(l=>l.id===activeListaId)?.nombre_lista}</span></h3>
                                                        <button onClick={async () => { if(confirm("¿Vaciar esta lista?")) await db.collection("v3_listas").doc(activeListaId).update({productos: []}); }} className="bg-red-600 text-white font-black text-[10px] uppercase px-3 py-1.5 rounded-lg border border-red-800">Vaciar Lista</button>
                                                    </div>
                                                    <div className="bg-orange-950 p-3 rounded-xl border-2 border-slate-950 font-mono text-[11px] font-black text-yellow-400 mb-3 text-center shadow-inner">
                                                        Producto [TAB] Precio Especifico [TAB] Pack [TAB] Categoría [TAB] Imagen URL [TAB] Oferta (Escribir SI o dejar vacío)
                                                    </div>
                                                    <textarea className="w-full h-20 p-4 rounded-2xl border-2 border-slate-950 text-xs font-mono outline-none bg-white text-slate-950 font-bold" placeholder="Pegá acá las celdas de tu Excel para esta lista..." value={bulkData} onChange={e => setBulkData(e.target.value)} />
                                                    <div className="flex gap-2 mt-2 font-black text-xs">
                                                        <button onClick={handleBulkProductosListaImport} className="flex-1 bg-slate-950 text-white py-3 rounded-xl shadow-md uppercase tracking-wider">Subir e Inyectar Excel a esta Lista</button>
                                                        <button onClick={addTemporalProductToList} className="bg-purple-600 text-white px-4 rounded-xl uppercase shadow-md">✨ Producto Especial</button>
                                                        <button onClick={printDocumentLista} className="bg-blue-600 text-white px-4 rounded-xl uppercase shadow-md">📄 Imprimir PDF</button>
                                                    </div>
                                                </div>

                                                <div className="bg-white border-2 border-slate-400 rounded-3xl shadow-md overflow-hidden">
                                                    <div className="p-3 bg-slate-100 border-b flex items-center">
                                                        <input type="text" placeholder="Filtrar productos de esta lista..." className="w-full p-2.5 rounded-xl border-2 border-slate-950 bg-white font-bold text-xs" onChange={e => setListaSearch(e.target.value)} />
                                                    </div>
                                                    <table className="w-full text-left border-collapse text-xs">
                                                        <thead className="bg-slate-950 text-white text-[10px] uppercase font-bold tracking-widest">
                                                            <tr><th className="p-4">Producto</th><th className="p-4">Precio Lista</th><th className="p-4 text-right">Acción</th></tr>
                                                        </thead>
                                                        <tbody className="divide-y font-bold">
                                                            {(listas.find(l=>l.id===activeListaId)?.productos || [])
                                                                .filter(p => (p.name || "").toLowerCase().includes(listaSearch.toLowerCase()))
                                                                .map((p, idx) => (
                                                                    <tr key={p.id || idx} className="hover:bg-slate-50">
                                                                        <td className="p-4">
                                                                            <span className="font-black text-slate-950 text-base">{p.name}</span>
                                                                            <br/>
                                                                            <span className="text-[10px] text-blue-600 uppercase font-black">{p.category} — Pack x{p.pack}</span>
                                                                        </td>
                                                                        <td className="p-4 text-sm font-black text-slate-950">
                                                                            $ {(p.price || 0).toFixed(2)}
                                                                            {p.es_oferta && <span className="bg-red-100 text-red-600 px-2 py-0.5 text-[9px] rounded-md font-black ml-2 uppercase">🔥 Oferta</span>}
                                                                        </td>
                                                                        <td className="p-4 text-right space-x-3">
                                                                            <button onClick={() => handleEditProductoInLista(p)} className="text-blue-600 font-bold uppercase text-[11px]">Editar</button>
                                                                            <button onClick={async () => {
                                                                                if(confirm("¿Eliminar de la lista?")) {
                                                                                    const nuevaListaProds = listas.find(l=>l.id===activeListaId).productos.filter(item => item.id !== p.id);
                                                                                    await db.collection("v3_listas").doc(activeListaId).update({productos: nuevaListaProds});
                                                                                }
                                                                            }} className="text-red-500 font-bold uppercase text-[11px]">Borrar</button>
                                                                        </td>
                                                                    </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </>
                                        ) : (
                                            <div className="bg-white border-2 border-slate-400 rounded-3xl p-20 text-center text-slate-500 font-black uppercase text-xs">
                                                👈 Seleccioná una Lista de Precios del panel izquierdo para cargarle mercadería o revisarla.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
