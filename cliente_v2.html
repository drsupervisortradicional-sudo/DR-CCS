<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Distribuciones | Catálogo de Pedidos</title>
    <!-- Firebase Legacy Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel estables UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        @media print { #root { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyABBIDqDnx-yu75601EQZ-yQ_VNkbdApGY",
            authDomain: "dr-ccs.firebaseapp.com",
            projectId: "dr-ccs",
            storageBucket: "dr-ccs.firebasestorage.app",
            messagingSenderId: "715483746859",
            appId: "1:715483746859:web:b3355feaa35baf709dd06e"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const App = () => {
            const [cliente, setCliente] = useState(null);
            const [productos, setProductos] = useState([]);
            const [nombreLista, setNombreLista] = useState("Catálogo General");
            const [activeTab, setActiveTab] = useState('catalogo');
            const [searchTerm, setSearchTerm] = useState("");
            const [notasCliente, setNotasCliente] = useState("");
            const [loading, setLoading] = useState(true);

            // Carrito persistente en memoria local
            const [cart, setCart] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                const clienteId = params.get('id') || 'general';
                const saved = localStorage.getItem(`dr_cart_v3_${clienteId}`);
                try { return saved ? JSON.parse(saved) : {}; } catch(e) { return {}; }
            });

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const clienteId = params.get('id') || 'general';
                localStorage.setItem(`dr_cart_v3_${clienteId}`, JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const clienteId = params.get('id');

                if (!clienteId) {
                    setLoading(false);
                    return;
                }

                db.collection("v3_clientes").doc(clienteId).get().then(doc => {
                    if (doc.exists) {
                        const cliData = { id: doc.id, ...doc.data() };
                        setCliente(cliData);

                        if (cliData.lista_id) {
                            db.collection("v3_listas").doc(cliData.lista_id).get().then(listaDoc => {
                                if (listaDoc.exists) {
                                    const lData = listaDoc.data();
                                    setProductos(lData.productos || []);
                                    if (lData.nombre_lista) setNombreLista(lData.nombre_lista);
                                }
                                setLoading(false);
                            });
                        } else {
                            db.collection("productos").get().then(snapshot => {
                                setProductos(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                                setLoading(false);
                            });
                        }
                    } else {
                        setLoading(false);
                    }
                });
            }, []);

            const productosValidos = useMemo(() => {
                return productos.filter(p => (p.price || 0) > 0);
            }, [productos]);

            const sortedProducts = useMemo(() => {
                return [...productosValidos].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            }, [productosValidos]);

            const categorizedProducts = useMemo(() => {
                const filtered = sortedProducts.filter(p => (p.name || "").toLowerCase().includes(searchTerm.toLowerCase()));
                
                const groups = filtered.reduce((acc, p) => {
                    const cat = (p.category || "VARIOS").toUpperCase().trim();
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(p);
                    return acc;
                }, {});

                return Object.keys(groups).sort().reduce((acc, cat) => {
                    acc[cat] = groups[cat];
                    return acc;
                }, {});
            }, [sortedProducts, searchTerm]);

            const selectedItems = useMemo(() => {
                return sortedProducts.filter(p => cart[p.id] && cart[p.id] > 0);
            }, [sortedProducts, cart]);

            const calcularPrecioFinal = (p) => {
                const descFicha = cliente?.descuento_extra || 0;
                const precioBase = p.price || 0;
                return precioBase * (1 - descFicha / 100);
            };

            const totalGeneral = useMemo(() => {
                return selectedItems.reduce((acc, p) => {
                    const precioUn = calcularPrecioFinal(p);
                    return acc + ((cart[p.id] || 0) * precioUn * (p.pack || 1));
                }, 0);
            }, [selectedItems, cart, cliente]);

            const vaciarCarrito = () => {
                if (confirm("¿Deseas vaciar todos los productos del pedido?")) {
                    setCart({});
                    setNotasCliente("");
                }
            };

            const enviarPedidoWhatsApp = () => {
                if (selectedItems.length === 0) return alert("Por favor, agregá al menos un producto al pedido.");
                
                let msg = `🛍️ *NUEVO PEDIDO DE CATÁLOGO*\n\n`;
                msg += `👤 *Cliente:* ${cliente?.nombre || 'Cliente General'}\n`;
                if (cliente?.direccion) msg += `📍 *Dirección:* ${cliente.direccion}\n`;
                if (notasCliente.trim()) msg += `📝 *Notas del cliente:* ${notasCliente}\n`;
                msg += `\n---------------------------------------\n\n`;

                selectedItems.forEach(p => {
                    const cantBultos = cart[p.id];
                    const precioUnFinal = calcularPrecioFinal(p);
                    const subtotal = cantBultos * precioUnFinal * (p.pack || 1);
                    
                    msg += `• *${p.name}* ${p.es_oferta ? '[OFERTA]' : ''}\n`;
                    msg += `  ${cantBultos} bultos (x${p.pack || 1} un.) | Un: $${precioUnFinal.toFixed(2)}\n`;
                    msg += `  Subtotal: $${subtotal.toFixed(2)}\n\n`;
                });

                msg += `---------------------------------------\n`;
                msg += `*TOTAL ESTIMADO: $ ${totalGeneral.toFixed(2)}*`;

                // NO SE BORRA EL CARRITO: Se mantiene intacto hasta que el cliente toque "Vaciar"
                window.open(`https://wa.me/5493416384086?text=${encodeURIComponent(msg)}`, '_blank');
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white p-4">
                        <div className="text-center space-y-3">
                            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                            <p className="font-bold text-sm tracking-wider uppercase">Cargando catálogo...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto md:my-6 bg-white shadow-2xl md:rounded-[2.5rem] flex flex-col min-h-screen md:min-h-0 border-4 border-slate-200 relative">
                    
                    <header className="bg-slate-950 text-white p-6 md:rounded-t-[2.2rem] border-b-4 border-blue-600">
                        <div className="flex justify-between items-start">
                            <div>
                                <h1 className="text-2xl md:text-3xl font-black text-blue-400">{cliente?.nombre || 'DR Distribuciones'}</h1>
                                <p className="text-xs text-slate-300 font-bold mt-1">📋 {nombreLista} {cliente?.descuento_extra > 0 && <span className="bg-green-600 text-white px-2 py-0.5 rounded-md font-black text-[10px] ml-2">-{cliente.descuento_extra}% APLICADO</span>}</p>
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white border-b-2 border-slate-200 flex p-1.5 sticky top-0 z-40 shadow-sm text-xs font-black uppercase">
                        <button onClick={() => setActiveTab('catalogo')} className={`flex-1 py-3.5 text-center rounded-xl transition ${activeTab === 'catalogo' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>📋 Catálogo</button>
                        <button onClick={() => setActiveTab('pedido')} className={`flex-1 py-3.5 text-center rounded-xl transition relative ${activeTab === 'pedido' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>
                            🛒 Tu Pedido
                            {selectedItems.length > 0 && (
                                <span className="ml-2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-black animate-bounce">{selectedItems.length}</span>
                            )}
                        </button>
                    </nav>

                    <div className="p-4 md:p-8 flex-1">
                        {activeTab === 'catalogo' && (
                            <section className="space-y-6">
                                <input type="text" placeholder="🔍 Buscar productos por marca o rubro..." className="w-full p-4 bg-slate-50 border-2 border-slate-300 rounded-2xl outline-none focus:border-blue-600 font-bold text-sm shadow-inner" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />

                                <div className="space-y-8">
                                    {Object.keys(categorizedProducts).length === 0 ? (
                                        <p className="text-center py-16 text-slate-400 font-black uppercase text-xs">No se encontraron productos disponibles</p>
                                    ) : (
                                        Object.keys(categorizedProducts).map(catName => (
                                            <div key={catName} className="space-y-4">
                                                <h2 className="text-xs font-black text-white bg-blue-600 px-4 py-2.5 rounded-xl uppercase tracking-widest flex items-center gap-2 shadow-sm">
                                                    <span className="w-2 h-2 bg-white rounded-full inline-block"></span>
                                                    {catName}
                                                </h2>

                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                                    {categorizedProducts[catName].map(p => {
                                                        const precioFinal = calcularPrecioFinal(p);
                                                        const imgUrl = p.imageUrl || p.image_url || "";
                                                        return (
                                                            <div key={p.id} className="border-2 border-slate-200 rounded-2xl p-4 flex flex-col justify-between bg-white shadow-sm hover:border-blue-300 transition relative">
                                                                <div>
                                                                    <div className="w-full h-28 bg-slate-50 rounded-xl mb-3 flex items-center justify-center overflow-hidden border border-slate-200 relative">
                                                                        {imgUrl ? (
                                                                            <img src={imgUrl} alt={p.name} className="w-full h-full object-contain p-1" />
                                                                        ) : (
                                                                            <span className="text-slate-300 text-2xl">🖼️</span>
                                                                        )}
                                                                        
                                                                        {p.es_oferta && (
                                                                            <span className="absolute top-2 right-2 bg-red-600 text-white font-black text-[9px] uppercase px-2 py-0.5 rounded-md shadow-md">
                                                                                🔥 Oferta
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    
                                                                    <h3 className="font-bold text-slate-900 text-sm leading-snug mb-1">
                                                                        {p.name}
                                                                    </h3>
                                                                    
                                                                    <p className="text-xs font-black text-blue-700 uppercase mb-3">
                                                                        $ {precioFinal.toFixed(2)} un. | Pack x{p.pack || 1}
                                                                        {p.es_oferta && <span className="text-red-600 font-black ml-1">[OFERTA]</span>}
                                                                    </p>
                                                                </div>

                                                                <div className="space-y-2">
                                                                    <input type="number" min="0" placeholder="0 bultos" className="w-full p-2.5 border-2 border-blue-500 bg-slate-50 rounded-xl text-center font-black text-blue-900 text-sm outline-none focus:border-blue-700" value={cart[p.id] || ""} onChange={e => setCart({...cart, [p.id]: parseInt(e.target.value) || 0})} />
                                                                    <div className="text-center font-extrabold text-slate-600 text-xs truncate">
                                                                        Subt: $ {((cart[p.id] || 0) * precioFinal * (p.pack || 1)).toFixed(2)}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {activeTab === 'pedido' && (
                            <section className="space-y-6">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="text-xl font-black text-slate-900">Resumen de tu Pedido</h2>
                                    {selectedItems.length > 0 && (
                                        <button onClick={vaciarCarrito} className="text-xs text-red-600 font-bold uppercase hover:underline">❌ Vaciar Pedido</button>
                                    )}
                                </div>

                                {selectedItems.length === 0 ? (
                                    <p className="text-center py-16 text-slate-400 font-black uppercase text-xs">No agregaste ningún artículo al pedido</p>
                                ) : (
                                    <>
                                        <div className="bg-white border-2 border-slate-300 rounded-2xl overflow-hidden shadow-sm divide-y">
                                            {selectedItems.map(p => {
                                                const precioUnFinal = calcularPrecioFinal(p);
                                                const subt = cart[p.id] * precioUnFinal * (p.pack || 1);
                                                return (
                                                    <div key={p.id} className="p-4 flex justify-between items-center">
                                                        <div>
                                                            <p className="font-bold text-slate-900 text-sm">
                                                                {p.name} {p.es_oferta && <span className="text-red-600 font-black text-xs">[OFERTA]</span>}
                                                            </p>
                                                            <p className="text-xs text-slate-500 font-bold">{cart[p.id]} bultos (x{p.pack || 1} un.) | $ {precioUnFinal.toFixed(2)} un.</p>
                                                        </div>
                                                        <p className="font-black text-slate-900 text-base">$ {subt.toFixed(2)}</p>
                                                    </div>
                                                );
                                            })}
                                            <div className="p-5 bg-slate-950 text-white flex justify-between items-center">
                                                <span className="font-black uppercase text-xs text-blue-400">Total Estimado</span>
                                                <span className="text-2xl font-black text-white">$ {totalGeneral.toFixed(2)}</span>
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <textarea placeholder="Notas adicionales sobre la entrega o el pedido..." className="w-full p-4 bg-slate-50 border-2 border-slate-300 rounded-2xl text-xs font-bold outline-none focus:border-blue-600 h-24" value={notasCliente} onChange={e => setNotasCliente(e.target.value)} />
                                            <button onClick={enviarPedidoWhatsApp} className="w-full bg-green-600 hover:bg-green-700 text-white font-black p-4 rounded-2xl uppercase tracking-wider text-xs shadow-md transition flex items-center justify-center gap-2">
                                                🚀 Enviar Pedido por WhatsApp
                                            </button>
                                        </div>
                                    </>
                                )}
                            </section>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
