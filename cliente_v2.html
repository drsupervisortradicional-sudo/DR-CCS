<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Distribuciones | Catálogo de Pedidos</title>
    <!-- Firebase Legacy Scripts (Máxima estabilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel estables UMD (Aislados de errores de módulos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e2e8f0; color: #0f172a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyABBIDqDnx-yu75601EQZ-yQ_VNkbdApGY",
            authDomain: "dr-ccs.firebaseapp.com",
            projectId: "dr-ccs",
            storageBucket: "dr-ccs.firebasestorage.app",
            messagingSenderId: "715483746859",
            appId: "1:715483746859:web:b3355feaa35baf709dd06e"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const App = () => {
            const [activeTab, setActiveTab] = useState('catalogo');
            const [clienteInfo, setClienteInfo] = useState(null);
            const [matrizModificaciones, setMatrizModificaciones] = useState({});
            const [products, setProducts] = useState([]);
            const [searchTerm, setSearchTerm] = useState("");
            const [notas, setNotas] = useState("");
            const [loading, setLoading] = useState(true);
            
            // Carrito conectado al LocalStorage para no perder datos si se corta la llamada o el 4G
            const [cart, setCart] = useState(() => {
                const saved = localStorage.getItem('dr_cart_v2_cliente');
                try { return saved ? JSON.parse(saved) : {}; } catch(e) { return {}; }
            });

            useEffect(() => {
                localStorage.setItem('dr_cart_v2_cliente', JSON.stringify(cart));
            }, [cart]);

            // Carga Dinámica e Inteligente basada en el ?id= de la URL
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const clienteId = urlParams.get('id');

                if (!clienteId) {
                    alert("⚠️ Enlace de catálogo incompleto o inválido.");
                    setLoading(false);
                    return;
                }

                // 1. Buscar la ficha y el perfil del cliente en la V2
                db.collection("v2_clientes").doc(clienteId).get().then(async (docSnap) => {
                    if (!docSnap.exists) {
                        alert("⚠️ Tu ficha de cliente no fue encontrada en el sistema.");
                        setLoading(false);
                        return;
                    }

                    const cliData = docSnap.data();
                    setClienteInfo({ id: docSnap.id, ...cliData });

                    // 2. Traer su Lista de Ofertas asignada desde el Admin
                    if (cliData.lista_id) {
                        const listaSnap = await db.collection("v2_listas").doc(cliData.lista_id).get();
                        if (listaSnap.exists) {
                            setMatrizModificaciones(listaSnap.data().modificaciones || {});
                        }
                    }

                    // Si el administrador le pre-cargó un carrito temporal en la base de datos (Regla de Venta Telefónica)
                    if (cliData.carrito_pre_cargado && Object.keys(cliData.carrito_pre_cargado).length > 0) {
                        setCart(cliData.carrito_pre_cargado);
                        setActiveTab('presupuesto'); // Abre directo en la pestaña de revisión
                    }

                    // 3. Traer los productos del depósito maestro
                    db.collection("v2_productos").onSnapshot((snapshot) => {
                        setProducts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                        setLoading(false);
                    });
                }).catch(err => {
                    console.error(err);
                    setLoading(false);
                });
            }, []);

            // Motor de Cálculo: Precio Neto automático sin obligar al cliente a hacer la cuenta
            const obtenerPrecioNetoYPromo = (p) => {
                const mod = matrizModificaciones[p.id] || {};
                
                // Toma el precio especial de su lista, si no hay usa el precio base general
                let precioBase = mod.precio_especial !== undefined ? mod.precio_especial : (p.price_base || 0);
                
                // Aplica la rebaja extra que tenga este cliente asignada individualmente (ej: -7%)
                if (clienteInfo && clienteInfo.descuento_extra > 0) {
                    precioBase = precioBase * (1 - (clienteInfo.descuento_extra / 100));
                }

                return {
                    precioNeto: Math.round(precioBase),
                    esOferta: !!mod.es_oferta
                };
            };

            const sortedProducts = useMemo(() => {
                return [...products].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            }, [products]);

            // MEJORADO: Buscador inteligente combinado por DESCRIPCIÓN y CATEGORÍA/RUBRO
            const categorizedProducts = useMemo(() => {
                const query = searchTerm.toLowerCase().trim();
                
                const filtered = sortedProducts.filter(p => {
                    const descMatch = (p.name || "").toLowerCase().includes(query);
                    const catMatch = (p.category || "").toLowerCase().includes(query);
                    return descMatch || catMatch;
                });
                
                const groups = filtered.reduce((acc, p) => {
                    const cat = (p.category || "VARIOS").toUpperCase().trim();
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(p);
                    return acc;
                }, {});

                return Object.keys(groups).sort().reduce((acc, cat) => {
                    acc[cat] = groups[cat];
                    return acc;
                }, {});
            }, [sortedProducts, searchTerm]);

            const selectedItems = useMemo(() => {
                return sortedProducts.filter(p => cart[p.id] && cart[p.id] > 0);
            }, [sortedProducts, cart]);

            const totalGeneral = useMemo(() => {
                return selectedItems.reduce((acc, p) => {
                    const { precioNeto } = obtenerPrecioNetoYPromo(p);
                    return acc + ((cart[p.id] || 0) * precioNeto * (p.pack || 1));
                }, 0);
            }, [selectedItems, cart, matrizModificaciones, clienteInfo]);

            const clearCart = () => {
                if(confirm("¿Deseas vaciar tu lista de pedido actual?")) {
                    setCart({});
                    setNotas("");
                }
            };

            const sendWhatsApp = () => {
                if (!clienteInfo) return;
                let msg = `*PEDIDO DR DISTRIBUCIONES*\n`;
                msg += `*Cliente:* ${clienteInfo.nombre}\n`;
                if(clienteInfo.direccion) msg += `*Dirección:* ${clienteInfo.direccion}\n`;
                if(notas) msg += `*Notas:* ${notas}\n`;
                msg += `\n--------------------------\n\n`;
                
                selectedItems.forEach(p => {
                    const { precioNeto } = obtenerPrecioNetoYPromo(p);
                    msg += `• *${p.name}*\n  Cant: ${cart[p.id]} bultos | Neto Un: $${precioNeto.toLocaleString()} | Subt: $${(cart[p.id] * precioNeto * (p.pack || 1)).toLocaleString()}\n\n`;
                });
                
                msg += `*TOTAL DEL PEDIDO: $${totalGeneral.toLocaleString()}*`;
                window.open(`https://wa.me/5493416384086?text=${encodeURIComponent(msg)}`);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-200 font-black text-slate-900 uppercase tracking-widest text-xs animate-pulse">
                        🔄 Levantando tu catálogo y ofertas exclusivas...
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto md:my-8 bg-white shadow-2xl md:rounded-[2.5rem] flex flex-col min-h-screen md:min-h-0 border-8 border-white relative">
                    
                    {/* NAV FLOTANTE STICKY SUPERIOR - Acompaña al cliente fijamente mientras baja por la lista */}
                    <nav className="bg-slate-950 text-white flex p-1.5 sticky top-0 z-50 shadow-xl md:rounded-t-[1.7rem] border-b-4 border-blue-600">
                        <button onClick={() => setActiveTab('catalogo')} className={`flex-1 py-4 rounded-2xl flex flex-col items-center gap-1 transition ${activeTab === 'catalogo' ? 'bg-blue-600 font-black scale-102' : 'opacity-60'}`}>
                            <span className="text-xl">📋</span><span className="text-[10px] uppercase font-black tracking-widest">Catálogo</span>
                        </button>
                        <button onClick={() => setActiveTab('presupuesto')} className={`flex-1 py-4 rounded-2xl flex flex-col items-center gap-1 relative transition ${activeTab === 'presupuesto' ? 'bg-blue-600 font-black scale-102' : 'opacity-60'}`}>
                            <span className="text-xl">🛒</span><span className="text-[10px] uppercase font-black tracking-widest">Mi Pedido</span>
                            {selectedItems.length > 0 && <span className="absolute top-2 right-4 bg-red-600 w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-black border border-white animate-bounce">{selectedItems.length}</span>}
                        </button>
                    </nav>

                    <div className="p-5 md:p-10 flex-1">
                        {/* TAB 1: CATALOGO */}
                        {activeTab === 'catalogo' && (
                            <section>
                                <div className="mb-6">
                                    <h1 className="text-3xl font-black text-slate-950 tracking-tight">DR DISTRIBUCIONES</h1>
                                    <p className="text-blue-600 text-xs font-black uppercase tracking-widest mt-0.5">Precios Netos para: {clienteInfo?.nombre}</p>
                                </div>
                                <input type="text" placeholder="Buscar por producto o por rubro (Ej: ALMACEN, LIMPIEZA)..." className="w-full p-4 bg-slate-100 text-slate-950 font-black rounded-2xl mb-6 outline-none border-2 border-slate-950 focus:border-blue-600 shadow-md text-sm placeholder-slate-500" onChange={e => setSearchTerm(e.target.value)} />
                                
                                <div className="space-y-8">
                                    {Object.keys(categorizedProducts).length === 0 ? (
                                        <p className="text-center text-slate-500 font-black uppercase py-10 text-xs">No se encontraron artículos o rubros con ese nombre</p>
                                    ) : (
                                        Object.keys(categorizedProducts).map(categoryName => (
                                            <div key={categoryName} className="space-y-4">
                                                <h2 className="text-xs font-black text-white bg-blue-600 px-5 py-3 rounded-2xl uppercase tracking-widest shadow-md flex items-center gap-2">
                                                    <span className="w-2 h-2 bg-white rounded-full inline-block"></span>
                                                    {categoryName}
                                                </h2>
                                                
                                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                                    {categorizedProducts[categoryName].map(p => {
                                                        const { precioNeto, esOferta } = obtenerPrecioNetoYPromo(p);
                                                        return (
                                                            <div key={p.id} className={`border-2 rounded-3xl p-4 flex flex-col bg-white shadow-sm justify-between relative overflow-hidden ${esOferta ? 'border-red-600 bg-red-50 shadow-red-100' : 'border-slate-300'}`}>
                                                                {esOferta && <span className="absolute top-0 right-0 bg-red-600 text-white text-[9px] font-black uppercase px-2.5 py-1 rounded-bl-xl tracking-widest shadow-sm">🔥 Oferta</span>}
                                                                <div>
                                                                    <div className="w-full h-28 bg-slate-50 border border-slate-300 rounded-2xl mb-3 flex items-center justify-center overflow-hidden">
                                                                        {p.imageUrl ? (
                                                                            <img src={p.imageUrl} alt={p.name} className="w-full h-full object-contain p-1" />
                                                                        ) : (
                                                                            <span className="text-slate-300 text-3xl">📦</span>
                                                                        )}
                                                                    </div>
                                                                    <h3 className="font-black text-slate-950 text-sm line-clamp-2 leading-snug mb-1">{p.name}</h3>
                                                                    <p className="text-[13px] text-blue-700 font-black uppercase mb-3">$ {precioNeto.toLocaleString()} un. | Pack x{p.pack || 1}</p>
                                                                </div>
                                                                <div className="space-y-2">
                                                                    <input type="number" min="0" placeholder="0 bultos" className="w-full p-2 border-2 border-slate-950 bg-white text-slate-950 font-black text-center rounded-xl outline-none focus:border-blue-600 shadow-sm text-sm" value={cart[p.id] || ""} onChange={e => setCart({...cart, [p.id]: parseInt(e.target.value) || 0})} />
                                                                    {/* DETALLE EXCLUSIVO: Letra grande text-sm font-black text-slate-950 para máxima lectura en la calle */}
                                                                    <div className="text-center font-black text-slate-950 text-sm truncate">
                                                                        Subt: $ {((cart[p.id] || 0) * precioNeto * (p.pack || 1)).toLocaleString()}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {/* TAB 2: RESUMEN PEDIDO */}
                        {activeTab === 'presupuesto' && (
                            <section className="space-y-6">
                                <div className="flex justify-between items-center border-b-2 border-slate-300 pb-2">
                                    <h2 className="text-2xl font-black text-slate-950 tracking-tight">Mi Detalle de Compra</h2>
                                    {selectedItems.length > 0 && <button onClick={clearCart} className="bg-red-50 hover:bg-red-100 border-2 border-red-600 text-red-700 px-4 py-1.5 rounded-xl text-xs font-black uppercase shadow-sm">❌ Vaciar</button>}
                                </div>
                                {selectedItems.length === 0 ? <p className="text-center py-20 text-slate-500 font-black uppercase text-xs tracking-wider">No tenés artículos cargados en tu lista</p> : (
                                    <>
                                        <div className="bg-white border-2 border-slate-400 rounded-3xl overflow-hidden shadow-md">
                                            {selectedItems.map(p => {
                                                const { precioNeto } = obtenerPrecioNetoYPromo(p);
                                                return (
                                                    <div key={p.id} className="flex justify-between items-center p-4 border-b border-slate-200 font-bold text-sm">
                                                        <div className="pr-2">
                                                            <p className="font-black text-slate-950 text-sm">{p.name}</p>
                                                            <p className="text-[11px] text-slate-600 uppercase font-black tracking-wide">{cart[p.id]} bultos x{p.pack || 1} un. ($ {precioNeto.toLocaleString()} un.)</p>
                                                        </div>
                                                        <p className="font-black text-slate-950 text-base flex-shrink-0">$ {((cart[p.id] || 0) * precioNeto * (p.pack || 1)).toLocaleString()}</p>
                                                    </div>
                                                );
                                            })}
                                            <div className="p-6 bg-slate-950 text-white flex justify-between items-center border-t-4 border-blue-600">
                                                <span className="font-black uppercase text-xs tracking-widest text-blue-400">Total Neto Compra</span>
                                                <span className="text-3xl font-black text-white">$ {totalGeneral.toLocaleString()}</span>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 gap-4 text-xs font-bold">
                                            <div>
                                                <label className="text-slate-950 block mb-1 uppercase text-[10px] font-black tracking-wider">¿Alguna aclaración sobre el despacho o artículos faltantes?</label>
                                                <textarea placeholder="Escribí acá si necesitás algún producto que no encontraste o detalles del reparto..." className="w-full p-4 bg-slate-50 border-2 border-slate-950 rounded-2xl h-24 outline-none focus:border-blue-600 font-black text-slate-950 text-sm" value={notas} onChange={e => setNotas(e.target.value)} />
                                            </div>
                                            <button onClick={sendWhatsApp} className="w-full bg-green-600 hover:bg-green-700 text-white font-black p-4 rounded-2xl flex items-center justify-center gap-2 uppercase tracking-widest text-xs shadow-md border-b-4 border-green-800 transition">
                                                💬 Confirmar y Enviar Pedido por WhatsApp
                                            </button>
                                        </div>
                                    </>
                                )}
                            </section>
                        )}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
